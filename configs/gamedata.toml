# CTakeDamageInfo's default constructor (the "no damage yet" template the
# game's own TakeDamageOld callers build their info from). TakeDamageOld
# must not be handed a zeroed block: the constructor writes the vtable at
# +0, FLT_MAX pairs at +32/+40, 1.0f at +128 and -1 handles at +232..248,
# and the body walks those. The Windows pattern is the no-argument
# constructor (server+0xfb2800, build 25947352); the other CTakeDamageInfo
# constructors there take a source object or the full argument list.
[signatures.CTakeDamageInfo_Constructor]
library = "server"
windows = "48 89 5C 24 ? 57 48 83 EC ? 33 FF C6 41 54 FF 48 89 79 70 48 8D 05 ? ? ? ? 48 89 B9 88 00 00 00"
