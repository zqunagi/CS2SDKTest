# CS2 gamedata for the gamedata test suite.
#
# Everything CounterStrikeSharp and its plugin ecosystem resolve out of band
# lives here: byte signatures for unexported functions, vtable slots the SDK
# does not declare, and struct byte offsets nobody publishes. The file is the
# input of GamedataSuite, which resolves every entry against the live server
# and exercises what it can - a key that only scans is a key nobody verified.
#
# Conventions, so a reader never has to guess what a number means:
#   [signatures.<key>]   byte pattern, hex, '?'/xx as wildcard, resolved by
#                        scanning the module named by library
#   [vtables.<key>]      vtable slot index on the named class (0-based, the
#                        way KHook::GetVtableIndex counts)
#   [offsets.<key>]      byte offset inside a struct or object
# windows/linux give per-platform values; a shared value is written once in
# the platform-neutral `value`/`pattern` key.

# ---------------------------------------------------------------------------
# signatures - server.dll / libserver.so
# ---------------------------------------------------------------------------

