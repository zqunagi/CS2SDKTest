<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS2SDKTest Results</title>
<style>
:root{
  --bg:#f7f8fa;--surface:#fff;--fg:#14181f;--mut:#667085;--line:#e4e7ec;--soft:#f2f4f7;
  --ok:#16a34a;--fail:#dc2626;--crash:#7f1d1d;--sus:#d97706;--skip:#98a2b3;--na:#cbd5e1;--acc:#2563eb;
  --shadow:0 1px 2px rgba(16,24,40,.06);
  --pop:0 8px 24px rgba(16,24,40,.14),0 1px 3px rgba(16,24,40,.08);
  --ease:cubic-bezier(.22,.8,.2,1);--t1:.15s;--t2:.25s;--t3:.5s;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0c0f14;--surface:#141922;--fg:#e6eaf0;--mut:#8b95a5;--line:#252c38;--soft:#1b212c;
  --ok:#34d399;--fail:#f87171;--crash:#fb7185;--sus:#fbbf24;--skip:#64748b;--na:#475569;--acc:#60a5fa;
  --shadow:none;
  --pop:0 8px 24px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04);
}}
*{box-sizing:border-box}
body{margin:0;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1040px;margin:0 auto;padding:36px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.02em}
.sub{color:var(--mut);margin-top:4px}
.hd{display:inline-flex;align-items:stretch;height:32px;border:1px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:var(--shadow);color:var(--mut);font-size:12.5px;line-height:1;white-space:nowrap;overflow:hidden}
.hd>*+*{border-left:1px solid var(--line)}
.it{display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-variant-numeric:tabular-nums}
.it[hidden]{display:none}
.it b{color:var(--fg);font-weight:600}
.it svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.gh{display:inline-flex;align-items:center;justify-content:center;width:36px;color:var(--fg);transition:background var(--t1) var(--ease)}
.gh:hover{background:var(--soft)}
.gh:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.gh svg{width:16px;height:16px;fill:currentColor}
.lang{display:inline-flex;align-items:center;gap:2px;padding:3px 3px 3px 10px;color:var(--mut)}
.lang>svg{width:14px;height:14px;flex:none;margin-right:5px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lang button{height:24px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:var(--mut);font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:background var(--t1) var(--ease),color var(--t1) var(--ease),transform var(--t1) var(--ease)}
.lang button:hover:not([aria-pressed=true]){color:var(--fg);background:var(--soft)}
.lang button[aria-pressed=true]{background:var(--fg);color:var(--bg);cursor:default}
.lang button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
@media(max-width:520px){.it .lb{display:none}.lang>svg{display:none}.lang{padding-left:3px}}
h2{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:32px 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.pad{padding:22px 24px}
.mono,code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--mut)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.completed{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.chip.crashed,.chip.timeout{color:var(--fail);background:color-mix(in srgb,var(--fail) 12%,transparent)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mut);margin-top:10px}
.meta b{color:var(--fg);font-weight:600}
.big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1}
.big small{font-size:14px;color:var(--mut);font-weight:500;margin-left:6px}
.bar{display:flex;gap:2px;height:10px;border-radius:999px;background:var(--soft);margin:16px 0 12px}
.bar i{display:block;min-width:3px;transition:transform var(--t1) var(--ease),opacity var(--t1) var(--ease),filter var(--t1) var(--ease)}
.bar i:first-child{border-radius:999px 0 0 999px}.bar i:last-child{border-radius:0 999px 999px 0}.bar i:only-child{border-radius:999px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px;transition:opacity var(--t1) var(--ease)}
.legend em{font-style:normal;color:var(--fg);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.OK{--c:var(--ok)}.FAIL{--c:var(--fail)}.CRASHED{--c:var(--crash)}.SUSPECT{--c:var(--sus)}.SKIP{--c:var(--skip)}.NA{--c:var(--na)}
.bar i,.dot{background:var(--c)}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--mut);text-align:left;font-size:12.5px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.run{cursor:pointer}
tbody tr.run td{transition:background var(--t1) var(--ease),box-shadow var(--t1) var(--ease)}
tbody tr.run:hover td{background:var(--soft)}
tbody tr.sel td{background:color-mix(in srgb,var(--acc) 8%,transparent)}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.hfilter{margin:0;padding:12px 16px 4px}
.hscroll{overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);color:var(--mut);font-size:12.5px}
.pager .pn{display:flex;align-items:center;gap:4px}
.pager button{min-width:30px;height:30px;padding:0 8px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--fg);font:inherit;font-size:12.5px;font-variant-numeric:tabular-nums;cursor:pointer;transition:background var(--t1) var(--ease),border-color var(--t1) var(--ease),transform var(--t1) var(--ease)}
.pager button:hover:not(:disabled):not([aria-current]){background:var(--soft);border-color:var(--line)}
.pager button[aria-current]{background:var(--fg);color:var(--bg);border-color:var(--fg);cursor:default}
.pager button:disabled{color:var(--na);cursor:default}
.pager button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.pager .gap{min-width:18px;text-align:center}
@media(max-width:720px){
  .hscroll th,.hscroll td{white-space:nowrap;padding-left:12px;padding-right:12px}
  .hfilter{padding:10px 12px 4px}
  .pager{padding:10px 12px;justify-content:center}
}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bad{color:var(--fail);font-weight:600}
.empty{padding:36px;text-align:center;color:var(--mut)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 12px;font:inherit;font-size:12.5px;cursor:pointer;transition:background var(--t1) var(--ease),border-color var(--t1) var(--ease),color var(--t1) var(--ease),transform var(--t1) var(--ease)}
.tab:hover:not([aria-pressed=true]){background:var(--soft)}
.tab:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tab[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab span{color:var(--mut);margin-left:4px}.tab[aria-pressed=true] span{color:inherit;opacity:.7}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 20px;transition:background var(--t1) var(--ease)}
summary:hover{background:var(--soft)}
summary::-webkit-details-marker{display:none}
summary::before{content:"›";color:var(--mut);transition:transform var(--t2) var(--ease);display:inline-block;width:10px}
details[open]>summary::before{transform:rotate(90deg)}
summary .name{font-weight:600}
summary .cnt{margin-left:auto;display:flex;gap:10px;color:var(--mut);font-size:12.5px}
summary .cnt b{color:var(--c);font-weight:600}
.rows{padding:0 20px 12px 40px}
.row{display:grid;grid-template-columns:78px minmax(0,1.3fr) minmax(0,1.7fr);gap:12px;padding:7px 0;border-top:1px dashed var(--line)}
.row:first-child{border-top:0}
.tag{font-size:11px;font-weight:700;color:var(--c);letter-spacing:.03em}
.row code{min-width:0;overflow-wrap:anywhere}
.row .d{color:var(--mut);min-width:0;word-break:break-word}
@media(max-width:720px){.row{grid-template-columns:70px 1fr}.row .d{grid-column:1/-1}}
.note{padding:14px 20px;color:var(--mut)}
.diff{padding:4px 20px 12px}
.diff .row{grid-template-columns:minmax(0,1.6fr) 150px}
.arrow{color:var(--mut)}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);color:var(--mut);font-size:12px;text-align:center}
footer a,footer a:link,footer a:visited,footer a:hover,footer a:active{color:inherit;text-decoration:none}
footer a:hover{text-decoration:underline}

/* ===== 动效：只动 transform / opacity；入场只在首屏播放一次 ===== */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.enter{animation:rise var(--t3) var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
.enter .bar i{transform-origin:left;animation:grow .7s var(--ease) backwards;animation-delay:calc(.25s + var(--n,0)*70ms)}
.swap>*{animation:rise var(--t2) var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
tbody tr.run{animation:fade var(--t2) var(--ease) both;animation-delay:calc(var(--i,0)*28ms)}
details[open]>.rows{animation:fade var(--t2) var(--ease)}
.row{animation:fade var(--t2) var(--ease) both;animation-delay:calc(var(--i,0)*12ms)}
.tab:active,.lang button:active:not([aria-pressed=true]),.pager button:active:not(:disabled){transform:scale(.96)}
@supports(interpolate-size:allow-keywords){
  :root{interpolate-size:allow-keywords}
  details::details-content{height:0;overflow:clip;transition:height var(--t2) var(--ease),content-visibility var(--t2) allow-discrete}
  details[open]::details-content{height:auto}
}
/* 进度条悬停：高亮当前段、淡化其余；浮层由 JS 定位 */
.bar.dim i:not(.hl){opacity:.35}
.bar i.hl{transform:scaleY(1.7);filter:saturate(1.15)}
.legend.dim span:not(.hl){opacity:.4}
#tip{position:fixed;left:0;top:0;z-index:10;pointer-events:none;display:flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);box-shadow:var(--pop);font-size:12.5px;line-height:1.3;white-space:nowrap;opacity:0;transform:translate(var(--x,0),calc(var(--y,0) + 4px));transition:opacity var(--t1) var(--ease),transform var(--t2) var(--ease)}
#tip.on{opacity:1;transform:translate(var(--x,0),var(--y,0))}
#tip .dot{width:8px;height:8px}
#tip b{font-weight:600;font-variant-numeric:tabular-nums}
#tip span{color:var(--mut);font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<main>
<header class="enter">
  <div><h1>CS2SDKTest</h1><div class="sub" data-i="sub"></div></div>
  <div class="hd">
    <div class="lang" role="group" data-al="langGroup"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><button type="button" data-l="en" lang="en">EN</button><button type="button" data-l="zh" lang="zh-CN">中文</button></div>
    <span class="it" id="runs" data-ti="runsTip" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span><b id="count"></b> <span class="lb" data-i="runsLb"></span></span></span>
    <a class="gh" href="https://github.com/zqunagi/CS2SDKTest" target="_blank" rel="noopener" data-al="ghRepo" data-ti="ghRepo"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a></div>
</header>

<div id="latest"></div>

<h2 data-i="hist" class="enter" style="--i:2"></h2>
<div class="card enter" id="history" style="--i:3"></div>

<div id="detail"></div>
<footer class="enter" style="--i:4">© <a href="https://github.com/zqunagi" target="_blank" rel="noopener">zqunagi</a></footer>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=(u,n=2)=>fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.json()}).catch(e=>{if(n>0)return get(u,n-1);throw e});
const L={
en:{
  title:'CS2SDKTest Results',sub:'Linux environment tests',runsTip:'Recorded runs',runsLb:'runs',ghRepo:'GitHub repository',langGroup:'Language',hist:'History',
  release:'New release',gameupdate:'Game update',manual:'Manual',
  completed:'Completed',crashed:'Crashed',timeout:'Timed out',
  FAIL:'Failed',CRASHED:'Crashed',SUSPECT:'Suspect',OK:'Passed',SKIP:'Skipped','N/A':'N/A',
  plugin:'Plugin',cs2ver:'CS2 version',lastCall:'Last call that did not return: ',noFull:'No complete results were produced for this run.',
  passedOf:'passed',nFailed:n=>`${n} failed`,loadFail:'Failed to load: ',noRuns:'No runs recorded yet',
  pageN:n=>`Page ${n}`,range:(a,b,n)=>`${a}–${b} of ${n}`,prev:'Previous page',next:'Next page',histNav:'History pagination',
  all:'All',thTime:'Time',thStatus:'Status',thTrigger:'Trigger',thFailed:'Failed',thCrashed:'Crashed',
  detail:'Details',resFail:'Failed to load the results file (slow or interrupted network). ',retry:'Retry',noResFile:'No complete results.json for this run; it did not finish.',
  attention:'Needs attention',changedVs:(r,v,n)=>`vs ${r} / ${v}: <b style="color:var(--fg)">${n}</b> result${n===1?'':'s'} changed`,noChange:(r,v)=>`No changes vs ${r} / ${v}`,more:n=>`… and ${n} more`,
  none:'No matching items',vtable:'vtable slot ',offset:'offset '},
zh:{
  title:'CS2SDKTest 测试结果',sub:'Linux 环境测试',runsTip:'已记录的运行次数',runsLb:'次运行',ghRepo:'GitHub 仓库',langGroup:'语言',hist:'历史',
  release:'新版本',gameupdate:'游戏更新',manual:'手动',
  completed:'已完成',crashed:'崩溃',timeout:'超时',
  FAIL:'失败',CRASHED:'崩溃',SUSPECT:'可疑',OK:'通过',SKIP:'跳过','N/A':'不可用',
  plugin:'插件',cs2ver:'CS2 版本',lastCall:'最后一个未返回的调用：',noFull:'这次没有生成完整结果。',
  passedOf:'通过',nFailed:n=>`${n} 项失败`,loadFail:'加载失败：',noRuns:'还没有运行记录',
  pageN:n=>`第 ${n} 页`,range:(a,b,n)=>`第 ${a}–${b} 条，共 ${n} 条`,prev:'上一页',next:'下一页',histNav:'历史分页',
  all:'全部',thTime:'时间',thStatus:'状态',thTrigger:'触发',thFailed:'失败',thCrashed:'崩溃',
  detail:'详情',resFail:'结果文件加载失败（网络较慢或中断）。',retry:'点此重试',noResFile:'这次没有完整的 results.json，运行未完成。',
  attention:'需关注',changedVs:(r,v,n)=>`相比 ${r} / ${v}，<b style="color:var(--fg)">${n}</b> 项结果有变化`,noChange:(r,v)=>`相比 ${r} / ${v}，没有变化`,more:n=>`… 另有 ${n} 项`,
  none:'没有符合条件的项目',vtable:'虚表槽位 ',offset:'偏移 '}
};
let lang='en';
try{const v=localStorage.getItem('lang');if(v in L)lang=v}catch(e){}
const t=(k,...a)=>{const v=(L[lang][k]??L.en[k]??k);return typeof v==='function'?v(...a):v};
// REASON/STATUS 的键（release、completed…）与词典同名，未知值返回 undefined 让调用处回退到原文
const tr=new Proxy({},{get:(_,k)=>typeof k==='string'&&k in L.en?t(k):undefined});
const REASON=tr,STATUS=tr;
const OUT=['FAIL','CRASHED','SUSPECT','OK','SKIP','N/A'];
const key=o=>o==='N/A'?'NA':o;
const label=new Proxy({},{get:(_,k)=>typeof k==='string'&&OUT.includes(k)?t(k):undefined});
const cache={};
let runs=[];

// Valve 总部（Bellevue）所在时区，随夏令时在 PST / PDT 间切换
const vfmt=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23',timeZoneName:'short'});
const vparts=t=>{const d=new Date(t);if(isNaN(d))return null;const o={};vfmt.formatToParts(d).forEach(p=>o[p.type]=p.value);return o};
const zone=t=>{const o=t&&vparts(t);return o?o.timeZoneName:''};
const when=t=>{const o=t&&vparts(t);return o?`${o.year}-${o.month}-${o.day} ${o.hour}:${o.minute}:${o.second}`:'-'};
// 与表头缩写不同（跨夏令时切换）时，在单元格里补上缩写
const whenZ=(t,z)=>when(t)+(zone(t)&&zone(t)!==z?' '+zone(t):'');
const ver=r=>r.game_version||r.game_buildid;
const num=n=>n==null?'-':n.toLocaleString();

function bar(s){
  const tot=s.total||1;
  const seg=[['OK',s.ok,t('OK')],['SUSPECT',s.suspect,t('SUSPECT')],['FAIL',s.failed,t('FAIL')],['CRASHED',s.crashed,t('CRASHED')],['SKIP',s.skipped,t('SKIP')],['NA',s.unavailable,t('N/A')]];
  return `<div class="bar">${seg.filter(x=>x[1]).map(([k,v,n],j)=>`<i class="${k}" style="width:${v/tot*100}%;--n:${j}" data-k="${k}" data-n="${esc(n)}" data-v="${num(v)}" data-p="${(v/tot*100).toFixed(1)}"></i>`).join('')}</div>
  <div class="legend">${seg.map(([k,v,n])=>`<span class="${k}" data-k="${k}"><i class="dot"></i>${n} <em>${num(v)}</em></span>`).join('')}</div>`;
}

// 展示用：去掉 SchemaDiff 结果名前面的 “SchemaDiff::”（只影响显示，配对仍用原始 call）
const callName=c=>String(c).replace(/^SchemaDiff::/,'');

async function gamedata(id){
  const k='gd:'+id;
  if(!(k in cache)) cache[k]=get('data/runs/'+encodeURIComponent(id)+'/gamedata.json').catch(()=>null);
  return cache[k];
}
// gamedata 行的第三列：不显示测试结果，显示这次测试所用平台（Linux）的 gamedata 内容
function gdCell(x,gd){
  if(x.suite!=='gamedata'||!gd||!(x.call in gd))return esc(x.detail);
  const v=gd[x.call], kind=x.call.split('.')[0];
  const lab=kind==='vtables'?t('vtable'):kind==='offsets'?t('offset'):'';
  return `${lab}<code>${esc(v)}</code>`;
}

async function result(id){
  if(!(id in cache)) cache[id]=get('data/runs/'+encodeURIComponent(id)+'/results.json').catch(()=>{delete cache[id];return null});
  return cache[id];
}

function hero(r,res){
  const s=res&&res.summary;
  const bad=s?s.failed+s.crashed:0;
  return `<div class="card pad enter" style="--i:1"><div class="hero">
    <div>
      <span class="chip ${esc(r.status)}">${esc(STATUS[r.status]||r.status)}</span>
      <div class="meta" style="margin-top:12px">
        <span>${t('plugin')} <b>${esc(r.release)}</b></span>
        <span>${t('cs2ver')} <b>${esc(ver(r))}</b></span>
        ${r.s2sdk?`<span>s2sdk <b>${esc(r.s2sdk)}</b></span>`:''}
        <span>${esc(REASON[r.reason]||r.reason)}</span>
        <span>${esc(when(r.finished))} ${esc(zone(r.finished))}</span>
      </div>
      ${r.suspect?`<div class="meta">${t('lastCall')}<code>${esc(r.suspect)}</code></div>`:''}
    </div>
    <div>${s?`<div class="big"><span class="cu" data-to="${s.ok}">${num(s.ok)}</span><small>/ ${num(s.total)} ${t('passedOf')}${bad?` · <span class="bad">${t('nFailed',bad)}</span>`:''}</small></div>${bar(s)}`
            :`<div class="sub">${t('noFull')}</div>`}</div>
  </div></div>`;
}

// 数字滚动：仅首屏一次；减少动效偏好下直接显示终值
function countUp(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  document.querySelectorAll('.cu').forEach(e=>{
    const to=+e.dataset.to,t0=performance.now(),d=700;
    const step=now=>{const p=Math.min(1,(now-t0)/d),k=1-Math.pow(1-p,3);e.textContent=num(Math.round(to*k));if(p<1)requestAnimationFrame(step)};
    e.textContent=num(0);requestAnimationFrame(step);
  });
}
// 进度条悬停：高亮对应段 + 自定义浮层（图例悬停同样联动）
const tip=document.body.appendChild(Object.assign(document.createElement('div'),{id:'tip',role:'tooltip'}));
function barHover(k){
  document.querySelectorAll('.bar,.legend').forEach(g=>g.classList.toggle('dim',!!k));
  document.querySelectorAll('.bar i,.legend span').forEach(e=>e.classList.toggle('hl',!!k&&e.dataset.k===k));
  const seg=k&&document.querySelector(`.bar i[data-k="${k}"]`);
  if(!seg){tip.classList.remove('on');return}
  tip.innerHTML=`<i class="dot ${k}"></i><span>${seg.dataset.n}</span><b>${seg.dataset.v}</b><span>${seg.dataset.p}%</span>`;
  const r=seg.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  const x=Math.min(Math.max(r.left+r.width/2-w/2,8),innerWidth-w-8);
  tip.style.setProperty('--x',x+'px');tip.style.setProperty('--y',(r.top-h-14)+'px');
  tip.classList.add('on');
}
if(matchMedia('(hover:hover)').matches){
  document.addEventListener('mouseover',e=>{const el=e.target.closest('.bar i,.legend span');barHover(el&&el.dataset.k||null)});
  document.addEventListener('scroll',()=>barHover(null),{passive:true});
}
let loadErr=null,latestRes=null;
const paintErr=()=>{$('#latest').innerHTML=`<div class="card empty">${t('loadFail')}${esc(loadErr)}</div>`};
const paintEmpty=()=>{$('#latest').innerHTML=`<div class="card empty">${t('noRuns')}</div>`;$('#history').innerHTML=''};

// 静态文案 + 语言切换按钮
function applyStatic(){
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ti]').forEach(e=>e.title=t(e.dataset.ti));
  document.querySelectorAll('[data-al]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.al)));
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
}
function setLang(l){
  if(l===lang||!(l in L))return;
  lang=l;try{localStorage.setItem('lang',l)}catch(e){}
  applyStatic();
  if(loadErr)return paintErr();
  if(!runs.length)return paintEmpty();
  $('#latest').innerHTML=hero(runs[0],latestRes).replace(/ enter" style="--i:1"/,'"');
  renderHistory(true);
  if(curId)show(curId,true,true);
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
applyStatic();

async function init(){
  try{
    ({runs}=await get('data/index.json'));
  }catch(e){loadErr=e.message;paintErr();return}
  $('#count').textContent=runs.length||'';$('#runs').hidden=!runs.length;
  if(!runs.length){paintEmpty();return}
  latestRes=await result(runs[0].id);
  $('#latest').innerHTML=hero(runs[0],latestRes);
  countUp();
  const hid=location.hash.length>1?decodeURIComponent(location.hash.slice(1)):'';
  const hi=runs.findIndex(r=>r.id===hid);
  if(hi>=0)pg=Math.floor(hi/PAGE_SIZE);
  renderHistory();
  show(location.hash.length>1?decodeURIComponent(location.hash.slice(1)):runs[0].id,true);
}

const PAGE_SIZE=7;
let trig='ALL', curId=null, pg=0;
const inTrig=r=>trig==='ALL'||r.reason===trig;

function pager(total,pages){
  if(pages<2)return '';
  const set=new Set([0,pages-1,pg-1,pg,pg+1]),nums=[];
  for(let i=0;i<pages;i++)if(set.has(i))nums.push(i);
  let btn='',last=-1;
  for(const i of nums){
    if(last>=0&&i-last>1)btn+='<span class="gap">…</span>';
    btn+=`<button data-p="${i}"${i===pg?' aria-current="page"':''} aria-label="${esc(t('pageN',i+1))}">${i+1}</button>`;
    last=i;
  }
  const from=pg*PAGE_SIZE+1,to=Math.min(total,(pg+1)*PAGE_SIZE);
  return `<nav class="pager" aria-label="${esc(t('histNav'))}"><span>${t('range',from,to,total)}</span><div class="pn">`+
    `<button data-p="${pg-1}"${pg===0?' disabled':''} aria-label="${esc(t('prev'))}">‹</button>${btn}`+
    `<button data-p="${pg+1}"${pg===pages-1?' disabled':''} aria-label="${esc(t('next'))}">›</button></div></nav>`;
}

function renderHistory(still){
  const reasons=[...new Set(runs.map(r=>r.reason))];
  const tabs=[['ALL',t('all'),runs.length],...reasons.map(k=>[k,REASON[k]||k,runs.filter(r=>r.reason===k).length])];
  const all=runs.filter(inTrig), pages=Math.max(1,Math.ceil(all.length/PAGE_SIZE));
  pg=Math.min(Math.max(pg,0),pages-1);
  const list=all.slice(pg*PAGE_SIZE,(pg+1)*PAGE_SIZE);
  $('#history').innerHTML=(reasons.length>1?`<div class="tabs hfilter">${tabs.map(t=>`<button class="tab" data-t="${esc(t[0])}" aria-pressed="${t[0]===trig}">${esc(t[1])}<span>${t[2]}</span></button>`).join('')}</div>`:'')+
    `<div class="hscroll"><table><thead><tr><th>${t('thTime')} (${esc(zone(runs[0].finished)||'PT')})</th><th>${t('thStatus')}</th><th>${t('thTrigger')}</th><th>${t('plugin')}</th><th>${t('cs2ver')}</th><th>s2sdk</th><th class="num">${t('thFailed')}</th><th class="num">${t('thCrashed')}</th></tr></thead><tbody>`+
    list.map((r,i)=>`<tr class="run" data-id="${esc(r.id)}"${still?' style="animation:none"':` style="--i:${i}"`}><td>${esc(whenZ(r.finished,zone(runs[0].finished)))}</td>
    <td><span class="chip ${esc(r.status)}">${esc(STATUS[r.status]||r.status)}</span></td>
    <td>${esc(REASON[r.reason]||r.reason)}</td><td>${esc(r.release)}</td><td class="mono">${esc(ver(r))}</td><td class="mono">${esc(r.s2sdk||'-')}</td>
    <td class="num ${r.failed?'bad':''}">${esc(r.failed??'-')}</td><td class="num ${r.crashed?'bad':''}">${esc(r.crashed??'-')}</td></tr>`).join('')+'</tbody></table></div>'+pager(all.length,pages);
  document.querySelectorAll('tr.run').forEach(tr=>tr.onclick=()=>show(tr.dataset.id));
  document.querySelectorAll('.hfilter .tab').forEach(b=>b.onclick=()=>{trig=b.dataset.t;pg=0;renderHistory();if(curId)show(curId,true)});
  document.querySelectorAll('.pager button[data-p]').forEach(b=>b.onclick=()=>{pg=+b.dataset.p;renderHistory()});
  if(curId)document.querySelectorAll('tr.run').forEach(tr=>tr.classList.toggle('sel',tr.dataset.id===curId));
}

async function show(id,quiet,still){
  const idx=runs.findIndex(r=>r.id===id);
  if(idx<0)return;
  curId=id;
  document.querySelectorAll('tr.run').forEach(tr=>tr.classList.toggle('sel',tr.dataset.id===id));
  if(!quiet)history.replaceState(null,'','#'+encodeURIComponent(id));
  const run=runs[idx], res=await result(id), d=$('#detail');
  const gd=await gamedata(id);
  if(!res){
    d.innerHTML=run.status==='completed'
      ?`<h2>${t('detail')}</h2><div class="card note">${t('resFail')}<a href="#" id="retry">${t('retry')}</a></div>`
      :`<h2>${t('detail')}</h2><div class="card note">${t('noResFile')}</div>`;
    const a=$('#retry');if(a)a.onclick=e=>{e.preventDefault();show(id,true)};
    return;
  }

  const prevRun=runs.slice(idx+1).find(r=>r.status==='completed'&&inTrig(r));
  const prev=prevRun?await result(prevRun.id):null;
  // 同一个 suite|call 可能出现多次（如不同场景的多条记录），按出现序号配对，避免后一条覆盖前一条
  const keyed=l=>{const n={};return l.map(x=>{const k=x.suite+'|'+x.call;return [k+'|'+(n[k]=(n[k]||0)+1),x]})};
  const before=new Map(keyed(prev?prev.results:[]).map(([k,x])=>[k,x.outcome]));
  const changed=prev?keyed(res.results).filter(([k,x])=>before.has(k)&&before.get(k)!==x.outcome):[];

  const counts={};
  res.results.forEach(x=>counts[x.outcome]=(counts[x.outcome]||0)+1);
  const problems=(counts.FAIL||0)+(counts.CRASHED||0)+(counts.SUSPECT||0);
  let filter=problems?'problems':'ALL';

  const render=()=>{
    const list=res.results.filter(x=>filter==='ALL'||(filter==='problems'?['FAIL','CRASHED','SUSPECT'].includes(x.outcome):x.outcome===filter));
    const bySuite=new Map();
    list.forEach(x=>{if(!bySuite.has(x.suite))bySuite.set(x.suite,[]);bySuite.get(x.suite).push(x)});
    const tabs=[['problems',t('attention'),problems],['ALL',t('all'),res.results.length],...OUT.filter(o=>counts[o]).map(o=>[o,t(o),counts[o]])];
    const open=filter==='problems'||filter==='FAIL'||filter==='CRASHED'||filter==='SUSPECT';
    d.classList.toggle('swap',!still);
    d.innerHTML=`<h2>${t('detail')} · ${esc(run.release)} · CS2 ${esc(ver(run))}${run.s2sdk?` · s2sdk ${esc(run.s2sdk)}`:''}</h2>
      ${prev?`<div class="card" style="margin-bottom:14px;--i:1">${changed.length
        ?`<div class="note" style="padding-bottom:6px">${t('changedVs',esc(prevRun.release),esc(ver(prevRun)),changed.length)}</div><div class="diff">${changed.slice(0,60).map(([k,x])=>{const b=before.get(k);return `<div class="row"><code>${esc(callName(x.call))}</code><span>${esc(label[b]||b)} <span class="arrow">→</span> <b class="${key(x.outcome)}" style="color:var(--c)">${esc(label[x.outcome]||x.outcome)}</b></span></div>`}).join('')}${changed.length>60?`<div class="note">${t('more',changed.length-60)}</div>`:''}</div>`
        :`<div class="note">${t('noChange',esc(prevRun.release),esc(ver(prevRun)))}</div>`}</div>`:''}
      <div class="tabs" style="--i:2">${tabs.map(t=>`<button class="tab" data-f="${esc(t[0])}" aria-pressed="${t[0]===filter}">${esc(t[1])}<span>${t[2]}</span></button>`).join('')}</div>
      <div class="card" style="--i:3">${bySuite.size?[...bySuite].map(([name,items])=>{
        const c={};items.forEach(x=>c[x.outcome]=(c[x.outcome]||0)+1);
        return `<details${open?' open':''}><summary><span class="name">${esc(name)}</span>
          <span class="cnt">${OUT.filter(o=>c[o]).map(o=>`<span class="${key(o)}"><b>${c[o]}</b> ${esc(t(o))}</span>`).join('')}</span></summary>
          <div class="rows">${items.map((x,i)=>`<div class="row ${key(x.outcome)}" style="--i:${Math.min(i,12)}"><span class="tag">${esc(x.outcome)}</span><code>${esc(callName(x.call))}</code><span class="d">${gdCell(x,gd)}</span></div>`).join('')}</div></details>`}).join('')
        :`<div class="empty">${t('none')}</div>`}</div>`;
    d.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
  };
  render();
}
init();
</script>
</body>
