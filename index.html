<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS2SDKTest 测试结果</title>
<style>
:root{
  --bg:#f7f8fa;--surface:#fff;--fg:#14181f;--mut:#667085;--line:#e4e7ec;--soft:#f2f4f7;
  --ok:#16a34a;--fail:#dc2626;--crash:#7f1d1d;--sus:#d97706;--skip:#98a2b3;--na:#cbd5e1;--acc:#2563eb;
  --shadow:0 1px 2px rgba(16,24,40,.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0c0f14;--surface:#141922;--fg:#e6eaf0;--mut:#8b95a5;--line:#252c38;--soft:#1b212c;
  --ok:#34d399;--fail:#f87171;--crash:#fb7185;--sus:#fbbf24;--skip:#64748b;--na:#475569;--acc:#60a5fa;
  --shadow:none;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:22px;font-weight:650;margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);margin-top:2px}
.gh{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.gh:hover{background:var(--soft)}
.gh svg{width:20px;height:20px;fill:currentColor}
.hd{display:flex;align-items:center;gap:14px}
h2{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:28px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.mono,code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--mut)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.completed{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.chip.crashed,.chip.timeout{color:var(--fail);background:color-mix(in srgb,var(--fail) 12%,transparent)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mut);margin-top:10px}
.meta b{color:var(--fg);font-weight:600}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
.big small{font-size:14px;color:var(--mut);font-weight:500;margin-left:6px}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--soft);margin:14px 0 10px}
.bar i{display:block;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{font-style:normal;color:var(--fg);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.OK{--c:var(--ok)}.FAIL{--c:var(--fail)}.CRASHED{--c:var(--crash)}.SUSPECT{--c:var(--sus)}.SKIP{--c:var(--skip)}.NA{--c:var(--na)}
.bar i,.dot{background:var(--c)}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--mut);text-align:left;font-size:12.5px;padding:10px 16px;border-bottom:1px solid var(--line)}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.run{cursor:pointer}
tbody tr.run:hover td{background:var(--soft)}
tbody tr.sel td{background:color-mix(in srgb,var(--acc) 8%,transparent)}
.hfilter{margin:0;padding:12px 16px 4px}
.hscroll{overflow:auto;overscroll-behavior:contain}
.hscroll th{position:sticky;top:0;z-index:1;background:var(--surface);border-bottom:0;box-shadow:inset 0 -1px var(--line)}
@media(max-width:720px){
  .hscroll th,.hscroll td{white-space:nowrap;padding-left:12px;padding-right:12px}
  .hfilter{padding:10px 12px 4px}
}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bad{color:var(--fail);font-weight:600}
.empty{padding:36px;text-align:center;color:var(--mut)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab span{color:var(--mut);margin-left:4px}.tab[aria-pressed=true] span{color:inherit;opacity:.7}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 20px}
summary::-webkit-details-marker{display:none}
summary::before{content:"›";color:var(--mut);transition:transform .12s;display:inline-block;width:10px}
details[open]>summary::before{transform:rotate(90deg)}
summary .name{font-weight:600}
summary .cnt{margin-left:auto;display:flex;gap:10px;color:var(--mut);font-size:12.5px}
summary .cnt b{color:var(--c);font-weight:600}
.rows{padding:0 20px 12px 40px}
.row{display:grid;grid-template-columns:78px minmax(0,1.3fr) minmax(0,1.7fr);gap:12px;padding:6px 0;border-top:1px dashed var(--line)}
.row:first-child{border-top:0}
.tag{font-size:11px;font-weight:700;color:var(--c);letter-spacing:.03em}
.row code{min-width:0;overflow-wrap:anywhere}
.row .d{color:var(--mut);min-width:0;word-break:break-word}
@media(max-width:720px){.row{grid-template-columns:70px 1fr}.row .d{grid-column:1/-1}}
.note{padding:14px 20px;color:var(--mut)}
.diff{padding:4px 20px 12px}
.diff .row{grid-template-columns:minmax(0,1.6fr) 150px}
.arrow{color:var(--mut)}
footer{margin-top:36px;color:var(--mut);font-size:12px;text-align:center}
footer a,footer a:link,footer a:visited,footer a:hover,footer a:active{color:inherit;text-decoration:none}
footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<main>
<header>
  <div><h1>CS2SDKTest</h1><div class="sub">Linux 环境测试</div></div>
  <div class="hd"><div class="sub" id="count"></div>
    <a class="gh" href="https://github.com/zqunagi/CS2SDKTest" target="_blank" rel="noopener" aria-label="GitHub 仓库" title="GitHub 仓库"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a></div>
</header>

<div id="latest"></div>

<h2>历史</h2>
<div class="card" id="history"></div>

<div id="detail"></div>
<footer>© <a href="https://github.com/zqunagi" target="_blank" rel="noopener">zqunagi</a></footer>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=u=>fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.json()});
const REASON={release:'新版本',gameupdate:'游戏更新',manual:'手动'};
const STATUS={completed:'已完成',crashed:'崩溃',timeout:'超时'};
const OUT=[['FAIL','失败'],['CRASHED','崩溃'],['SUSPECT','可疑'],['OK','通过'],['SKIP','跳过'],['N/A','不可用']];
const key=o=>o==='N/A'?'NA':o;
const label=Object.fromEntries(OUT);
const cache={};
let runs=[];

// Valve 总部（Bellevue）所在时区，随夏令时在 PST / PDT 间切换
const vfmt=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23',timeZoneName:'short'});
const vparts=t=>{const d=new Date(t);if(isNaN(d))return null;const o={};vfmt.formatToParts(d).forEach(p=>o[p.type]=p.value);return o};
const zone=t=>{const o=t&&vparts(t);return o?o.timeZoneName:''};
const when=t=>{const o=t&&vparts(t);return o?`${o.year}-${o.month}-${o.day} ${o.hour}:${o.minute}:${o.second}`:'-'};
// 与表头缩写不同（跨夏令时切换）时，在单元格里补上缩写
const whenZ=(t,z)=>when(t)+(zone(t)&&zone(t)!==z?' '+zone(t):'');
const ver=r=>r.game_version||r.game_buildid;
const num=n=>n==null?'-':n.toLocaleString();

function bar(s){
  const t=s.total||1;
  const seg=[['OK',s.ok,'通过'],['SUSPECT',s.suspect,'可疑'],['FAIL',s.failed,'失败'],['CRASHED',s.crashed,'崩溃'],['SKIP',s.skipped,'跳过'],['NA',s.unavailable,'不可用']];
  return `<div class="bar">${seg.filter(x=>x[1]).map(([k,v,n])=>`<i class="${k}" style="width:${v/t*100}%" title="${n} ${v}"></i>`).join('')}</div>
  <div class="legend">${seg.map(([k,v,n])=>`<span class="${k}"><i class="dot"></i>${n} <em>${num(v)}</em></span>`).join('')}</div>`;
}

async function gamedata(id){
  const k='gd:'+id;
  if(!(k in cache)) cache[k]=get('data/runs/'+encodeURIComponent(id)+'/gamedata.json').catch(()=>null);
  return cache[k];
}
// gamedata 行的第三列：不显示测试结果，显示这次测试所用平台（Linux）的 gamedata 内容
function gdCell(x,gd){
  if(x.suite!=='gamedata'||!gd||!(x.call in gd))return esc(x.detail);
  const v=gd[x.call], kind=x.call.split('.')[0];
  const lab=kind==='vtables'?'虚表槽位 ':kind==='offsets'?'偏移 ':'';
  return `${lab}<code>${esc(v)}</code>`;
}

async function result(id){
  if(!(id in cache)) cache[id]=get('data/runs/'+encodeURIComponent(id)+'/results.json').catch(()=>null);
  return cache[id];
}

function hero(r,res){
  const s=res&&res.summary;
  const bad=s?s.failed+s.crashed:0;
  return `<div class="card pad"><div class="hero">
    <div>
      <span class="chip ${esc(r.status)}">${esc(STATUS[r.status]||r.status)}</span>
      <div class="meta" style="margin-top:12px">
        <span>插件 <b>${esc(r.release)}</b></span>
        <span>CS2 版本 <b>${esc(ver(r))}</b></span>
        ${r.s2sdk?`<span>s2sdk <b>${esc(r.s2sdk)}</b></span>`:''}
        <span>${esc(REASON[r.reason]||r.reason)}</span>
        <span>${esc(when(r.finished))} ${esc(zone(r.finished))}</span>
      </div>
      ${r.suspect?`<div class="meta">最后一个未返回的调用：<code>${esc(r.suspect)}</code></div>`:''}
    </div>
    <div>${s?`<div class="big">${num(s.ok)}<small>/ ${num(s.total)} 通过${bad?` · <span class="bad">${bad} 项失败</span>`:''}</small></div>${bar(s)}`
            :`<div class="sub">这次没有生成完整结果。</div>`}</div>
  </div></div>`;
}

async function init(){
  try{
    ({runs}=await get('data/index.json'));
  }catch(e){$('#latest').innerHTML=`<div class="card empty">加载失败：${esc(e.message)}</div>`;return}
  $('#count').textContent=runs.length?`共 ${runs.length} 次运行`:'';
  if(!runs.length){
    $('#latest').innerHTML='<div class="card empty">还没有运行记录</div>';
    $('#history').innerHTML='';return;
  }
  $('#latest').innerHTML=hero(runs[0],await result(runs[0].id));
  renderHistory();
  show(location.hash.length>1?decodeURIComponent(location.hash.slice(1)):runs[0].id,true);
}

const VISIBLE_ROWS=7;
let trig='ALL', curId=null;
const inTrig=r=>trig==='ALL'||r.reason===trig;

function renderHistory(){
  const reasons=[...new Set(runs.map(r=>r.reason))];
  const tabs=[['ALL','全部',runs.length],...reasons.map(k=>[k,REASON[k]||k,runs.filter(r=>r.reason===k).length])];
  const list=runs.filter(inTrig);
  $('#history').innerHTML=(reasons.length>1?`<div class="tabs hfilter">${tabs.map(t=>`<button class="tab" data-t="${esc(t[0])}" aria-pressed="${t[0]===trig}">${esc(t[1])}<span>${t[2]}</span></button>`).join('')}</div>`:'')+
    `<div class="hscroll"><table><thead><tr><th>时间 (${esc(zone(runs[0].finished)||'PT')})</th><th>状态</th><th>触发</th><th>插件</th><th>CS2 版本</th><th>s2sdk</th><th class="num">失败</th><th class="num">崩溃</th></tr></thead><tbody>`+
    list.map(r=>`<tr class="run" data-id="${esc(r.id)}"><td>${esc(whenZ(r.finished,zone(runs[0].finished)))}</td>
    <td><span class="chip ${esc(r.status)}">${esc(STATUS[r.status]||r.status)}</span></td>
    <td>${esc(REASON[r.reason]||r.reason)}</td><td>${esc(r.release)}</td><td class="mono">${esc(ver(r))}</td><td class="mono">${esc(r.s2sdk||'-')}</td>
    <td class="num ${r.failed?'bad':''}">${esc(r.failed??'-')}</td><td class="num ${r.crashed?'bad':''}">${esc(r.crashed??'-')}</td></tr>`).join('')+'</tbody></table></div>';
  document.querySelectorAll('tr.run').forEach(tr=>tr.onclick=()=>show(tr.dataset.id));
  document.querySelectorAll('.hfilter .tab').forEach(b=>b.onclick=()=>{trig=b.dataset.t;renderHistory();if(curId)show(curId,true)});
  // 只显示最新 VISIBLE_ROWS 条，其余滚动查看
  const sc=$('.hscroll'), rows=sc.querySelectorAll('tbody tr');
  if(rows.length>VISIBLE_ROWS)sc.style.maxHeight=(sc.querySelector('thead').offsetHeight+rows[0].offsetHeight*VISIBLE_ROWS+1)+'px';
  if(curId)document.querySelectorAll('tr.run').forEach(tr=>tr.classList.toggle('sel',tr.dataset.id===curId));
}

async function show(id,quiet){
  const idx=runs.findIndex(r=>r.id===id);
  if(idx<0)return;
  curId=id;
  document.querySelectorAll('tr.run').forEach(tr=>tr.classList.toggle('sel',tr.dataset.id===id));
  if(!quiet)history.replaceState(null,'','#'+encodeURIComponent(id));
  const run=runs[idx], res=await result(id), d=$('#detail');
  const gd=await gamedata(id);
  if(!res){d.innerHTML='<h2>详情</h2><div class="card note">这次没有完整的 results.json，运行未完成。</div>';return}

  const prevRun=runs.slice(idx+1).find(r=>r.status==='completed'&&inTrig(r));
  const prev=prevRun?await result(prevRun.id):null;
  const before=new Map((prev?prev.results:[]).map(x=>[x.suite+'|'+x.call,x.outcome]));
  const changed=prev?res.results.filter(x=>before.has(x.suite+'|'+x.call)&&before.get(x.suite+'|'+x.call)!==x.outcome):[];

  const counts={};
  res.results.forEach(x=>counts[x.outcome]=(counts[x.outcome]||0)+1);
  const problems=(counts.FAIL||0)+(counts.CRASHED||0)+(counts.SUSPECT||0);
  let filter=problems?'problems':'ALL';

  const render=()=>{
    const list=res.results.filter(x=>filter==='ALL'||(filter==='problems'?['FAIL','CRASHED','SUSPECT'].includes(x.outcome):x.outcome===filter));
    const bySuite=new Map();
    list.forEach(x=>{if(!bySuite.has(x.suite))bySuite.set(x.suite,[]);bySuite.get(x.suite).push(x)});
    const tabs=[['problems','需关注',problems],['ALL','全部',res.results.length],...OUT.filter(o=>counts[o[0]]).map(o=>[o[0],o[1],counts[o[0]]])];
    const open=filter==='problems'||filter==='FAIL'||filter==='CRASHED'||filter==='SUSPECT';
    d.innerHTML=`<h2>详情 · ${esc(run.release)} · CS2 ${esc(ver(run))}${run.s2sdk?` · s2sdk ${esc(run.s2sdk)}`:''}</h2>
      ${prev?`<div class="card" style="margin-bottom:14px">${changed.length
        ?`<div class="note" style="padding-bottom:6px">相比 ${esc(prevRun.release)} / ${esc(ver(prevRun))}，<b style="color:var(--fg)">${changed.length}</b> 项结果有变化</div><div class="diff">${changed.slice(0,60).map(x=>{const b=before.get(x.suite+'|'+x.call);return `<div class="row"><code>${esc(x.call)}</code><span>${esc(label[b]||b)} <span class="arrow">→</span> <b class="${key(x.outcome)}" style="color:var(--c)">${esc(label[x.outcome]||x.outcome)}</b></span></div>`}).join('')}${changed.length>60?`<div class="note">… 另有 ${changed.length-60} 项</div>`:''}</div>`
        :`<div class="note">相比 ${esc(prevRun.release)} / ${esc(ver(prevRun))}，没有变化</div>`}</div>`:''}
      <div class="tabs">${tabs.map(t=>`<button class="tab" data-f="${esc(t[0])}" aria-pressed="${t[0]===filter}">${esc(t[1])}<span>${t[2]}</span></button>`).join('')}</div>
      <div class="card">${bySuite.size?[...bySuite].map(([name,items])=>{
        const c={};items.forEach(x=>c[x.outcome]=(c[x.outcome]||0)+1);
        return `<details${open?' open':''}><summary><span class="name">${esc(name)}</span>
          <span class="cnt">${OUT.filter(o=>c[o[0]]).map(o=>`<span class="${key(o[0])}"><b>${c[o[0]]}</b> ${esc(o[1])}</span>`).join('')}</span></summary>
          <div class="rows">${items.map(x=>`<div class="row ${key(x.outcome)}"><span class="tag">${esc(x.outcome)}</span><code>${esc(x.call)}</code><span class="d">${gdCell(x,gd)}</span></div>`).join('')}</div></details>`}).join('')
        :'<div class="empty">没有符合条件的项目</div>'}</div>`;
    d.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
  };
  render();
}
init();
</script>
</body>
</html>
